services:
  trader:
    image: ${REGISTRY_URL:-localhost:5000}/${IMAGE_NAME:-trader-v2}:latest
    container_name: trader-v2
    restart: unless-stopped
    command: ["python", "main.py", "--server", "--verbose"]
    networks:
      - trader-net
    volumes:
      - ./logs:/app/logs
      - ${HOST_DATA_PATH:-./data}:/app/data
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

  watcher:
    image: ${REGISTRY_URL:-localhost:5000}/${IMAGE_NAME:-trader-v2}:latest
    container_name: trader-watcher
    restart: unless-stopped
    command: ["python", "main.py", "--watch", "--verbose"]
    networks:
      - trader-net
    volumes:
      - ./logs:/app/logs
      - ${HOST_DATA_PATH:-./data}:/app/data
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - trader

  ui:
    image: ${REGISTRY_URL:-localhost:5000}/${IMAGE_NAME:-trader-v2}:latest
    container_name: trader-v2-ui
    restart: unless-stopped
    working_dir: /app/dashboard
    command: ["reflex", "run", "--env", "prod", "--backend-host", "0.0.0.0"]
    ports:
      - "3000:3000"
      - "8000:8000"
    networks:
      - trader-net
    volumes:
      - ./logs:/app/logs
      - ${HOST_DATA_PATH:-./data}:/app/data
    env_file:
      - .env
    depends_on:
      - trader

networks:
  trader-net:
    external: true
