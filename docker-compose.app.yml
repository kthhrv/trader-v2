version: '3.8'

services:
  trader:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
    container_name: trader-v2
    restart: unless-stopped
    command: ["python", "main.py", "--server", "--verbose"]
    networks:
      - trader-net
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

  watcher:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
    container_name: trader-watcher
    restart: unless-stopped
    command: ["python", "main.py", "--watch"]
    networks:
      - trader-net
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - trader

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
    container_name: trader-v2-ui
    restart: unless-stopped
    working_dir: /app/dashboard
    command: ["reflex", "run", "--env", "prod", "--backend-host", "0.0.0.0"]
    ports:
      - "3000:3000"
      - "8000:8000"
    networks:
      - trader-net
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    env_file:
      - .env
    depends_on:
      - trader

networks:
  trader-net:
    external: true
