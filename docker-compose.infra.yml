version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: trader-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - trader-net
    volumes:
      - redis-data:/data

  market-streamer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
    container_name: trader-streamer
    restart: unless-stopped
    command: ["python", "-m", "app.streamer.main"]
    depends_on:
      - redis
    networks:
      - trader-net
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis

networks:
  trader-net:
    external: true

volumes:
  redis-data:
