[project]
name = "trader-v2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.2",
    "coverage>=7.13.1",
    "feedparser>=6.0.12",
    "google-genai>=1.60.0",
    "holidays>=0.89",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pandas>=2.3.3",
    "pandas-ta>=0.4.71b0",
    "pydantic-settings>=2.12.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.1",
    "sqlmodel>=0.0.31",
    "tenacity>=9.1.2",
    "plotly>=6.0.0",
    "watchdog>=6.0.0",
    "matplotlib>=3.10.0",
    "reflex>=0.8.26",
    "redis>=7.1.0",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.11",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "invoke>=2.2.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-httpx>=0.36.0",
    "ruff>=0.14.13",
    "ty>=0.0.13",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
