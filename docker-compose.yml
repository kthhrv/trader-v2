version: '3.8'

services:
  trader:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
    container_name: trader-v2
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    env_file:
      - .env

  watchdog:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
    container_name: trader-v2-watchdog
    restart: unless-stopped
    command: ["uv", "run", "python", "watchdog.py"]
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    env_file:
      - .env
    depends_on:
      - trader

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
    container_name: trader-v2-ui
    restart: unless-stopped
    working_dir: /app/dashboard
    command: ["uv", "run", "reflex", "run", "--env", "prod", "--backend-host", "0.0.0.0"]
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    env_file:
      - .env
    depends_on:
      - trader
