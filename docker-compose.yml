version: '3.8'

services:
  trader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trader-v2
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    env_file:
      - .env

  watchdog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trader-v2-watchdog
    restart: unless-stopped
    command: ["uv", "run", "python", "watchdog.py"]
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    env_file:
      - .env
    depends_on:
      - trader

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trader-v2-ui
    restart: unless-stopped
    command: ["uv", "run", "streamlit", "run", "app/ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    env_file:
      - .env
    depends_on:
      - trader
