services:
  watchdog:
    image: ${REGISTRY_URL:-localhost:5000}/${IMAGE_NAME:-trader-v2}:latest
    container_name: trader-v2-watchdog
    restart: unless-stopped
    command: ["python", "watchdog.py"]
    networks:
      - trader-net
    volumes:
      - ./logs:/app/logs
      - ${HOST_DATA_PATH:-./data}:/app/data
    env_file:
      - .env

networks:
  trader-net:
    external: true
