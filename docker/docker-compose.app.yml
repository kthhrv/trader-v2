services:
  trader:
    image: ${REGISTRY_URL:-localhost:5000}/${IMAGE_NAME:-trader-v2}:${IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}-trader
    restart: unless-stopped
    command: ["python", "main.py", "--server", "--verbose"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - RUNNING_IN_DOCKER=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 512m

  watcher:
    image: ${REGISTRY_URL:-localhost:5000}/${IMAGE_NAME:-trader-v2}:${IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}-watcher
    restart: unless-stopped
    command: ["python", "main.py", "--watch", "--verbose"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - RUNNING_IN_DOCKER=true
    depends_on:
      - trader
    mem_limit: 256m

  ui:
    image: ${REGISTRY_URL:-localhost:5000}/${IMAGE_NAME:-trader-v2}:${IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}-ui
    restart: unless-stopped
    working_dir: /app/dashboard
    command: ["reflex", "run", "--env", "prod", "--backend-host", "0.0.0.0"]
    ports:
      - "${UI_PORT:-3000}:3000"
      - "${UI_API_PORT:-8000}:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - API_URL=http://192.168.0.191:${UI_API_PORT:-8020}
      - REFLEX_API_URL=http://192.168.0.191:${UI_API_PORT:-8020}
      - NODE_OPTIONS=--max-old-space-size=1024
    depends_on:
      - trader
    mem_limit: 1536m
    oom_score_adj: 500
