services:
  redis:
    image: redis:alpine
    container_name: trader-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - trader-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - redis-data:/data

  market-streamer:
    image: ${REGISTRY_URL:-localhost:5000}/${IMAGE_NAME:-trader-v2}:latest
    container_name: trader-streamer
    restart: unless-stopped
    command: ["python", "-m", "app.streamer.main"]
    depends_on:
      - redis
    networks:
      - trader-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - RUNNING_IN_DOCKER=true

networks:
  trader-net:
    external: true

volumes:
  redis-data:
