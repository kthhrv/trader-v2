services:
  redis:
    image: redis:alpine
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - redis-data:/data

  market-streamer:
    image: ${REGISTRY_URL:-localhost:5000}/${IMAGE_NAME:-trader-v2}:latest
    container_name: ${COMPOSE_PROJECT_NAME}-streamer
    restart: unless-stopped
    command: ["python", "-m", "app.streamer.main"]
    depends_on:
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - RUNNING_IN_DOCKER=true

volumes:
  redis-data:
