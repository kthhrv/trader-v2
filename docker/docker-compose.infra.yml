services:
  redis:
    image: redis:alpine
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    restart: unless-stopped
    ports:
      - "${REDIS_EXPOSED_PORT:-6379}:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - redis-data:/data
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    mem_limit: 256m

  market-streamer:
    image: ${REGISTRY_URL:-localhost:5000}/${IMAGE_NAME:-trader-v2}:${IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}-streamer
    restart: unless-stopped
    command: ["python", "-m", "app.streamer.main"]
    depends_on:
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - RUNNING_IN_DOCKER=true
    mem_limit: 512m

volumes:
  redis-data:
