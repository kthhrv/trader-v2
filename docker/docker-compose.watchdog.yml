services:
  watchdog:
    image: ${REGISTRY_URL:-localhost:5000}/${IMAGE_NAME:-trader-v2}:${IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}-watchdog
    restart: unless-stopped
    command: ["python", "watchdog.py"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - RUNNING_IN_DOCKER=true
    mem_limit: 128m
